name: Build local installer draft

on:
  push:
    branches: [feat/han-ngu-bien-local-release]
    paths: [.github/workflows/local-release.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Local release candidate version
        type: string
        required: true
        default: 1.0.0-rc.1

permissions:
  contents: read

concurrency:
  group: local-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-helpers:
    if: github.repository == 'trandongphuong/duolingo-clone' && github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test local helpers with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 is required for this check.' }
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node is required for binary transport tests.' }
          & .\tests\windows-local-smoke.ps1

      - name: Test backup helpers with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 is required for this check.' }
          & .\tests\windows-backup-smoke.ps1

  draft-installer:
    # Standard public-repository runners are free. Never select a paid runner
    # or run this publishing job from an unrelated fork/private repository.
    if: github.repository == 'trandongphuong/duolingo-clone' && github.event.repository.private == false
    needs: windows-helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      REQUESTED_VERSION: ${{ inputs.version || '1.0.0-rc.1' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          version = os.environ['REQUESTED_VERSION']
          if len(version) > 64 or not re.fullmatch(r'(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-rc\.(?:0|[1-9][0-9]*))?', version):
              raise SystemExit('Use a valid x.y.z or x.y.z-rc.n version.')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if commit != os.environ['GITHUB_SHA']:
              raise SystemExit('Checkout differs from the requested workflow commit.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'RELEASE_VERSION={version}\n')
              output.write(f'HANNGU_IMAGE=han-ngu-bien:{version}\n')
              output.write(f'HANNGU_TOOLS_IMAGE=han-ngu-bien-tools:{version}\n')
              output.write(f'RELEASE_FILENAME=han-ngu-bien-{version}-linux-amd64.zip\n')
              output.write(f'RELEASE_TAG=local-{version}-{commit[:12]}\n')
          PY

      - name: Verify the release packager's guard tests
        run: python3 tests/test_release_package.py

      - name: Build pinned source Docker images
        run: scripts/docker-build.sh

      - name: Export and package the source-free installer
        shell: bash
        run: |
          set -euo pipefail
          scripts/offline-export.sh work/hnb-images.tar.gz
          python3 scripts/package-offline.py \
            --images work/hnb-images.tar.gz \
            --output "work/releases/$RELEASE_FILENAME" \
            --version "$RELEASE_VERSION"

      - name: Create or finish a draft release without overwriting assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > work/check-release.py <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.request

          def verify_release(data, expected, repository, tag, commit, allow_missing):
              if data.get('draft') is not True or data.get('prerelease') is not True:
                  raise ValueError('Existing release must remain a draft prerelease.')
              if data.get('tag_name') != tag or data.get('target_commitish') != commit:
                  raise ValueError('Existing release targets another tag or source commit.')
              url = data.get('html_url', '')
              if not url.startswith(f'https://github.com/{repository}/releases/') or any(c.isspace() for c in url):
                  raise ValueError('Unexpected release Dashboard URL.')
              seen = set()
              assets = data.get('assets')
              if not isinstance(assets, list):
                  raise ValueError('GitHub did not return an asset list; inspect the draft.')
              for asset in assets:
                  name = asset.get('name')
                  if name not in expected or name in seen:
                      raise ValueError('Unexpected or duplicate existing asset; inspect the draft.')
                  seen.add(name)
                  size, digest = expected[name]
                  if asset.get('state') != 'uploaded' or asset.get('size') != size or asset.get('digest') != 'sha256:' + digest:
                      raise ValueError('Existing asset differs or lacks its SHA256 digest; nothing was replaced.')
              missing = sorted(set(expected) - seen)
              if missing and not allow_missing:
                  raise ValueError('Draft upload is incomplete; do not use it as a completed installer.')
              return {'mode': 'existing', 'missing': missing, 'url': url}

          def find_release(repository, tag, read_json):
              # The /releases/tags endpoint excludes drafts. Authenticated list
              # requests include drafts visible to this contents-write token.
              matches = []
              for page in range(1, 21):
                  releases = read_json(f'/repos/{repository}/releases?per_page=100&page={page}')
                  if not isinstance(releases, list):
                      raise ValueError('GitHub did not return a release list.')
                  matches += [item for item in releases if isinstance(item, dict) and item.get('tag_name') == tag]
                  if len(matches) > 1:
                      raise ValueError('Multiple releases use this tag; inspect them before retrying.')
                  if len(releases) < 100:
                      break
              else:
                  raise ValueError('Release listing exceeded the review limit; no new draft was created.')
              if not matches:
                  return None
              release_id = matches[0].get('id')
              if type(release_id) is not int or release_id <= 0:
                  raise ValueError('GitHub returned an invalid release identifier.')
              detail = read_json(f'/repos/{repository}/releases/{release_id}')
              if not isinstance(detail, dict) or detail.get('id') != release_id:
                  raise ValueError('GitHub returned another release detail.')
              return detail

          def main():
              repository = os.environ['GITHUB_REPOSITORY']
              tag, commit = os.environ['RELEASE_TAG'], os.environ['GITHUB_SHA']
              directory = pathlib.Path('work/releases')
              names = [os.environ['RELEASE_FILENAME'], os.environ['RELEASE_FILENAME'] + '.sha256']
              expected = {}
              for name in names:
                  file = directory / name
                  with file.open('rb') as stream:
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  if file.stat().st_size >= 2 * 1024 ** 3:
                      raise ValueError('A release asset must be smaller than 2GiB.')
                  expected[name] = (file.stat().st_size, digest)
              def read_json(path):
                  request = urllib.request.Request(
                      'https://api.github.com' + path,
                      headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                               'Accept': 'application/vnd.github+json',
                               'X-GitHub-Api-Version': '2022-11-28',
                               'Cache-Control': 'no-cache'})
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.load(response)
                  except urllib.error.HTTPError:
                      raise ValueError('Cannot verify the draft through the GitHub API.') from None
              data = find_release(repository, tag, read_json)
              allow_missing = os.environ.get('RELEASE_CHECK_COMPLETE') != 'true'
              if data is None:
                  if not allow_missing:
                      raise ValueError('Created draft is not visible; this upload has not been verified.')
                  state = {'mode': 'create', 'missing': names}
              else:
                  state = verify_release(data, expected, repository, tag, commit, allow_missing)
              pathlib.Path('work/release-state.json').write_text(json.dumps(state), encoding='utf-8')
              notes = (
                  f'Bản ứng viên local {os.environ["RELEASE_VERSION"]}, Docker Linux/amd64.\n\n'
                  f'Source commit: `{commit}`.\n\n'
                  'Tải file han-ngu-bien-…-linux-amd64.zip và .zip.sha256 trong Assets; '
                  'Source code.zip tự sinh của GitHub không phải bộ cài offline. '
                  'Gói không chứa credentials, DB, media người học hoặc chứng chỉ/key.\n\n'
                  'Chưa chứng nhận Windows thật hoặc máy airgap độc lập; xem báo cáo nghiệm thu trong gói. '
                  f'Hướng dẫn: https://github.com/{repository}/blob/{commit}/docs/WINDOWS_LOCAL.md\n')
              pathlib.Path('work/release-notes.md').write_text(notes, encoding='utf-8')

          if __name__ == '__main__':
              try:
                  main()
              except (OSError, ValueError) as error:
                  raise SystemExit(f'Draft release verification failed: {error}') from None
          PY
          python3 work/check-release.py
          mode=$(python3 -c 'import json; print(json.load(open("work/release-state.json"))["mode"])')
          if [[ "$mode" == create ]]; then
            gh release create "$RELEASE_TAG" \
              "work/releases/$RELEASE_FILENAME" "work/releases/$RELEASE_FILENAME.sha256" \
              --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Hán ngữ biển $RELEASE_VERSION — local RC" \
              --notes-file work/release-notes.md
          else
            while IFS= read -r name; do
              gh release upload "$RELEASE_TAG" "work/releases/$name" --repo "$GITHUB_REPOSITORY"
            done < <(python3 -c 'import json,sys; sys.stdout.write("".join(name + "\n" for name in json.load(open("work/release-state.json"))["missing"]))')
          fi
          RELEASE_CHECK_COMPLETE=true python3 work/check-release.py
          python3 - <<'PY'
          import json, os, pathlib
          state = json.loads(pathlib.Path('work/release-state.json').read_text())
          checksum = pathlib.Path('work/releases', os.environ['RELEASE_FILENAME'] + '.sha256').read_text().strip()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(f'### Local installer draft ready\n\n[Open the draft release]({state["url"]})\n\n')
              output.write('Owner/write-access login is required. This workflow does not publish the release.\n\n')
              output.write(f'```text\n{checksum}\n```\n\n')
              output.write('Actual Windows and independent airgap acceptance remain NOT TESTED.\n')
          PY

      - name: Report an incomplete run
        if: failure()
        run: |
          printf '%s\n' '### Installer draft not completed by this run' '' \
            'Inspect build/upload errors and any existing draft. Do not use a partial ZIP/checksum pair or publish it.' \
            >> "$GITHUB_STEP_SUMMARY"
