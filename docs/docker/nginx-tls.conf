# LAN TLS ingress. Certificates are supplied by the approved local operator.
# No ACME, certificate download or public service is needed at runtime.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    server_tokens off;
    client_max_body_size 6m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    resolver 127.0.0.11 valid=5s ipv6=off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/tls/server.crt;
        ssl_certificate_key /run/tls/server.key;

        location / {
            set $app_upstream http://app:3000;
            proxy_pass $app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }

    # Not published and bound only to this container's loopback interface.
    # Readiness still reaches the real app instead of returning a static 200.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /healthz {
            set $app_health http://app:3000/sign-in;
            proxy_pass $app_health;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 5s;
        }
        location / { return 404; }
    }
}
