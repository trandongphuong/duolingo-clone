# LAN HTTP ingress only. Production TLS terminates at the approved LAN proxy.
# App and database have no external network interface/default route.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    server_tokens off;
    # Allow multipart overhead; application validates the 5MB file limit.
    client_max_body_size 6m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    # Refresh app DNS after container recreation; do not keep an old app IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8080;
        location / {
            set $app_upstream http://app:3000;
            proxy_pass $app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # Do not accept a forged client X-Forwarded-For value.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
