name: han-ngu-bien

x-app-environment: &app-environment
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  DATABASE_URL: postgresql://${POSTGRES_USER:-hanngu}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private env file}@db:5432/${POSTGRES_DB:-hanngu}
  SESSION_PASSWORD: ${SESSION_PASSWORD:?Set a random SESSION_PASSWORD with at least 32 characters}
  SESSION_SECURE: ${SESSION_SECURE:-true}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  MEDIA_DIR: /data/media
  TZ: ${TZ:-Asia/Bangkok}
  # Clear inherited Docker client proxy defaults. Runtime has no public egress.
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  NO_PROXY: localhost,127.0.0.1,db
  no_proxy: localhost,127.0.0.1,db

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hanngu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private env file}
      POSTGRES_DB: ${POSTGRES_DB:-hanngu}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lan_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: ${HANNGU_IMAGE:-han-ngu-bien:1.0}
    pull_policy: never
    build:
      context: .
      target: app
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data/media
    networks:
      - lan_backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const {Pool} = require('pg');
          const pool = new Pool({connectionString: process.env.DATABASE_URL, max: 1, connectionTimeoutMillis: 1500, query_timeout: 1500});
          (async () => {
            try {
              if ((process.env.SESSION_PASSWORD || '').length < 32) throw Error('session');
              const result = await pool.query("SELECT to_regclass('public.users') IS NOT NULL AS ready");
              if (!result.rows[0].ready) throw Error('schema');
              const response = await fetch('http://127.0.0.1:3000/sign-in', {signal: AbortSignal.timeout(1500)});
              if (!response.ok) throw Error('http');
            } catch { process.exitCode = 1; }
            finally { await pool.end(); }
          })().catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ingress:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    pull_policy: never
    restart: unless-stopped
    user: "101:101"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,app
      no_proxy: localhost,127.0.0.1,app
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${LAN_HOST:-127.0.0.1}:${LAN_PORT:-3000}:8080"
    volumes:
      - ./docs/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ingress
      - lan_backend
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  tools:
    image: ${HANNGU_TOOLS_IMAGE:-han-ngu-bien-tools:1.0}
    pull_policy: never
    build:
      context: .
      target: tools
    profiles:
      - tools
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data/media
    networks:
      - lan_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  ingress:
  lan_backend:
    internal: true

volumes:
  postgres_data:
  media:
